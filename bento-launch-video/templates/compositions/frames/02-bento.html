          tl.fromTo(session, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T_RUN);
          tl.fromTo(dot, { scale: 1 }, { scale: 1.45, duration: 0.65, ease: "sine.inOut", yoyo: true, repeat: 13 }, T_RUN);
          tl.to(drawer, { x: 0, duration: 0.55, ease: "power3.out" }, T_DRAWER);
          for (var n = 0; n < lineEls.length; n++) {
            tl.fromTo(lineEls[n], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.32, ease: "power2.out" }, T_LINES[n]);
          }
          var blink = { p: 0 };
          tl.to(blink, {
            p: Math.PI * 2 * (TOTAL / 0.8), duration: TOTAL, ease: "none",
            onUpdate: function () {
              var typing = driver.t >= T_LINES[5] && driver.t < T_LINES[6];
              cur.style.opacity = typing && Math.sin(blink.p) > 0 ? "1" : "0";
            },
          }, 0);
          var S = layout === "tall" ? 1.1 : 1.12;
          var offX = layout === "tall" ? 0 : 290;
          var offY = layout === "tall" ? 0 : 24;
          tl.to(world, { scale: S, x: -offX * S, y: -offY * S, duration: 1.6, ease: "power2.inOut" }, T_ZOOM);

          window.__timelines["bento"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
