<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bento Slack integration launch (16:9)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e0d0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0e0d0b; }
      .clip { position: absolute; inset: 0; will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.6" data-width="1920" data-height="1080">
      <div id="f1" class="clip" data-composition-id="slack" data-composition-src="compositions/frames/01-slack.html" data-variable-values='{"layout":"wide"}' data-start="0" data-duration="10.1" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="f2" class="clip" data-composition-id="bento" data-composition-src="compositions/frames/02-bento.html" data-variable-values='{"layout":"wide"}' data-start="9.6" data-duration="10.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f3" class="clip" data-composition-id="close" data-composition-src="compositions/frames/03-close.html" data-variable-values='{"layout":"wide"}' data-start="19.6" data-duration="3" data-track-index="2" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const W = 1920;
      tl.to("#f1", { x: -W, duration: 0.5, ease: "power3.inOut" }, 9.6);
      tl.fromTo("#f2", { x: W }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 9.6);
      tl.to("#f2", { opacity: 0, duration: 0.6, ease: "power1.inOut" }, 19.6);
      tl.fromTo("#f3", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 19.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
